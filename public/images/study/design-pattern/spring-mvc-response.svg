<svg xmlns="http://www.w3.org/2000/svg" width="480" height="884" viewBox="0 0 480 884" role="img" aria-labelledby="title desc">
<title id="title">Spring MVC의 두 응답 경로</title><desc id="desc">공통 요청 처리와 HTML 및 응답 본문 경로</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#475569" stroke-width="2"/></marker></defs>
<rect width="480" height="884" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b4d">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#172b4d">Spring MVC의 두 응답 경로</text>
<rect x="32" y="70" width="416" height="70" rx="12" fill="#ffffff" stroke="#aab7c8" stroke-width="1.5"/>
<text x="240.0" y="99.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">① HTTP 요청</text>
<text x="240.0" y="127.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">DispatcherServlet이 받음</text>
<path d="M 240 142 L 240 171" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="183" width="416" height="78" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="216.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">② HandlerMapping에 조회</text>
<text x="240.0" y="244.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">요청을 처리할 핸들러 찾기</text>
<path d="M 240 263 L 240 292" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="304" width="416" height="78" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="337.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">③ HandlerAdapter에 실행 위임</text>
<text x="240.0" y="365.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">Controller 호출 → 결과 반환</text>
<path d="M 240 384 L 240 413" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="425" width="416" height="68" rx="12" fill="#ffffff" stroke="#aab7c8" stroke-width="1.5"/>
<text x="240.0" y="467.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">④ 반환값의 의미에 따라 처리</text>
<path d="M 151 495 L 128 535" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 329 495 L 352 535" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="546" width="208" height="90" rx="12" fill="#e5f4ef" stroke="#6dab97" stroke-width="1.5"/>
<text x="128.0" y="585.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">View 이름</text>
<text x="128.0" y="613.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">Model 데이터</text>
<rect x="248" y="546" width="208" height="90" rx="12" fill="#fff1e1" stroke="#d4a268" stroke-width="1.5"/>
<text x="352.0" y="585.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">@ResponseBody</text>
<text x="352.0" y="613.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">응답 데이터</text>
<path d="M 128 638 L 128 674" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 352 638 L 352 674" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="686" width="208" height="120" rx="12" fill="#e5f4ef" stroke="#6dab97" stroke-width="1.5"/>
<text x="128.0" y="726.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">DispatcherServlet</text>
<text x="128.0" y="754.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">→ ViewResolver</text>
<text x="128.0" y="782.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">→ View → HTML</text>
<rect x="248" y="686" width="208" height="120" rx="12" fill="#fff1e1" stroke="#d4a268" stroke-width="1.5"/>
<text x="352.0" y="726.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">어댑터 안에서</text>
<text x="352.0" y="754.0" font-size="18" font-weight="400" text-anchor="middle" fill="#172b4d">HttpMessageConverter</text>
<text x="352.0" y="782.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">→ JSON 등 본문</text>
<text x="240" y="854" font-size="19" font-weight="400" text-anchor="middle" fill="#172b4d">찾기와 실행은 DispatcherServlet이 조정한다.</text>
</g></svg>
