<svg xmlns="http://www.w3.org/2000/svg" width="480" height="630" viewBox="0 0 480 630" role="img" aria-labelledby="title desc">
<title id="title">결제 수단을 추가하면 어디가 바뀔까?</title><desc id="desc">주문과 결제의 분리 전후 비교</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#475569" stroke-width="2"/></marker></defs>
<rect width="480" height="630" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b4d">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#172b4d">결제 수단을 추가하면 어디가 바뀔까?</text>
<text x="28" y="82" font-size="22" font-weight="700" text-anchor="start" fill="#172b4d">분리 전 · 주문 코드도 수정</text>
<rect x="32" y="100" width="416" height="100" rx="12" fill="#fff1e1" stroke="#d4a268" stroke-width="1.5"/>
<text x="240.0" y="144.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">주문 처리 안에서 직접 선택</text>
<text x="240.0" y="172.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">카드 결제 / 계좌 이체 분기 추가</text>
<text x="28" y="247" font-size="22" font-weight="700" text-anchor="start" fill="#172b4d">분리 후 · 결제 구현과 선택 설정 추가</text>
<rect x="32" y="269" width="416" height="68" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="311.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">주문 처리 · 기존 흐름 유지</text>
<path d="M 240 338 L 240 375" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="262" y="367" font-size="20" font-weight="400" text-anchor="start" fill="#172b4d">결제 요청</text>
<rect x="32" y="385" width="416" height="68" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="427.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">공통 결제 계약 · pay()</text>
<path d="M 132 454 L 132 494" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 348 454 L 348 494" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="505" width="200" height="76" rx="12" fill="#ffffff" stroke="#aab7c8" stroke-width="1.5"/>
<text x="132.0" y="537.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">카드 결제</text>
<text x="132.0" y="565.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">기존 구현</text>
<rect x="248" y="505" width="200" height="76" rx="12" fill="#e5f4ef" stroke="#6dab97" stroke-width="1.5"/>
<text x="348.0" y="537.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">계좌 이체</text>
<text x="348.0" y="565.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">새 구현 추가</text>
<text x="240" y="611" font-size="20" font-weight="400" text-anchor="middle" fill="#172b4d">계약이 바뀌면 호출부도 수정할 수 있다.</text>
</g></svg>
