<svg xmlns="http://www.w3.org/2000/svg" width="480" height="530" viewBox="0 0 480 530" role="img" aria-labelledby="title desc">
<title id="title">실제 결제 전에 요청을 확인한다</title><desc id="desc">프록시의 허용과 거부 경로</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#475569" stroke-width="2"/></marker></defs>
<rect width="480" height="530" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b4d">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#172b4d">실제 결제 전에 요청을 확인한다</text>
<rect x="32" y="70" width="416" height="76" rx="12" fill="#ffffff" stroke="#aab7c8" stroke-width="1.5"/>
<text x="240.0" y="102.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">① 호출부</text>
<text x="240.0" y="130.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">PaymentClient.pay()</text>
<path d="M 240 148 L 240 179" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="190" width="416" height="84" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="226.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">② PaymentClientProxy</text>
<text x="240.0" y="254.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">로그 기록 → 권한 확인</text>
<path d="M 154 276 L 128 344" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 326 276 L 352 344" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="120" y="313" font-size="20" font-weight="400" text-anchor="middle" fill="#172b4d">허용</text>
<text x="362" y="313" font-size="20" font-weight="400" text-anchor="middle" fill="#172b4d">거부</text>
<rect x="28" y="357" width="200" height="94" rx="12" fill="#e5f4ef" stroke="#6dab97" stroke-width="1.5"/>
<text x="128.0" y="398.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">③ 실제 결제</text>
<text x="128.0" y="426.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">RealPaymentClient</text>
<rect x="252" y="357" width="200" height="94" rx="12" fill="#fff1e1" stroke="#d4a268" stroke-width="1.5"/>
<text x="352.0" y="398.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">예외로 종료</text>
<text x="352.0" y="426.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">대상 호출 없음</text>
<text x="240" y="494" font-size="20" font-weight="400" text-anchor="middle" fill="#172b4d">프록시를 거친 호출에 정책이 적용된다.</text>
</g></svg>
