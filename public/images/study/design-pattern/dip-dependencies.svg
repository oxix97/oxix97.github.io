<svg xmlns="http://www.w3.org/2000/svg" width="480" height="668" viewBox="0 0 480 668" role="img" aria-labelledby="title desc">
<title id="title">코드가 무엇에 의존하는가?</title><desc id="desc">직접 의존과 공통 계약을 통한 의존 비교</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#475569" stroke-width="2"/></marker></defs>
<rect width="480" height="668" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b4d">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#172b4d">코드가 무엇에 의존하는가?</text>
<text x="28" y="82" font-size="22" font-weight="700" text-anchor="start" fill="#172b4d">변경 전 · 구체 카드 구현을 사용</text>
<rect x="32" y="100" width="416" height="60" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="138.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">CheckoutService</text>
<path d="M 240 162 L 240 199" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="262" y="188" font-size="20" font-weight="400" text-anchor="start" fill="#172b4d">사용</text>
<rect x="32" y="210" width="416" height="60" rx="12" fill="#fff1e1" stroke="#d4a268" stroke-width="1.5"/>
<text x="240.0" y="248.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">CardPaymentStrategy</text>
<text x="28" y="320" font-size="22" font-weight="700" text-anchor="start" fill="#172b4d">변경 후 · 공통 결제 계약을 사용</text>
<rect x="32" y="340" width="416" height="60" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="378.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">CheckoutService</text>
<path d="M 240 401 L 240 450" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="262" y="434" font-size="20" font-weight="400" text-anchor="start" fill="#172b4d">사용</text>
<rect x="32" y="461" width="416" height="72" rx="12" fill="#e5f4ef" stroke="#6dab97" stroke-width="1.5"/>
<text x="240.0" y="491.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">PaymentStrategy</text>
<text x="240.0" y="519.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">pay(amount)</text>
<rect x="32" y="593" width="416" height="52" rx="12" fill="#ffffff" stroke="#aab7c8" stroke-width="1.5"/>
<text x="240.0" y="627.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">CardPaymentStrategy</text>
<path d="M 240 591 L 240 536" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="262" y="571" font-size="20" font-weight="400" text-anchor="start" fill="#172b4d">계약 구현</text>
</g></svg>
