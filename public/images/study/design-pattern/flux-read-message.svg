<svg xmlns="http://www.w3.org/2000/svg" width="480" height="582" viewBox="0 0 480 582" role="img" aria-labelledby="title desc">
<title id="title">읽음 요청 하나가 화면에 반영되는 길</title><desc id="desc">전통적인 Flux의 메시지 읽음 처리</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#475569" stroke-width="2"/></marker></defs>
<rect width="480" height="582" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b4d">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#172b4d">읽음 요청 하나가 화면에 반영되는 길</text>
<rect x="32" y="68" width="416" height="82" rx="12" fill="#ffffff" stroke="#aab7c8" stroke-width="1.5"/>
<text x="240.0" y="103.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">① 사용자: 메시지를 읽음으로 표시</text>
<text x="240.0" y="131.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">View가 Action 생성</text>
<path d="M 240 151 L 240 176" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="182" width="416" height="82" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="217.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">② Action → Dispatcher</text>
<text x="240.0" y="245.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">등록된 Store 콜백에 전달</text>
<path d="M 240 265 L 240 290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="296" width="416" height="82" rx="12" fill="#e5f4ef" stroke="#6dab97" stroke-width="1.5"/>
<text x="240.0" y="331.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">③ Store: 읽음 상태 갱신</text>
<text x="240.0" y="359.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">관련 Action을 해석하고 변경 통지</text>
<path d="M 240 379 L 240 404" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="410" width="416" height="82" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="445.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">④ View: 같은 상태를 다시 읽기</text>
<text x="240.0" y="473.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">목록 표시와 안 읽은 개수 갱신</text>
<text x="240" y="558" font-size="20" font-weight="400" text-anchor="middle" fill="#172b4d">다음 사용자 행동 등이 새 Action을 만든다.</text>
</g></svg>
