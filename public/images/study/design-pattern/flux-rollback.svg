<svg xmlns="http://www.w3.org/2000/svg" width="480" height="542" viewBox="0 0 480 542" role="img" aria-labelledby="title desc">
<title id="title">먼저 표시하고 실패하면 되돌린다</title><desc id="desc">단일 요청의 낙관적 갱신과 실패 복구</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#475569" stroke-width="2"/></marker></defs>
<rect width="480" height="542" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b4d">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#172b4d">먼저 표시하고 실패하면 되돌린다</text>
<rect x="32" y="68" width="416" height="82" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="103.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">① 읽음 요청 Action</text>
<text x="240.0" y="131.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">Store 갱신 → 목록·배지에 먼저 반영</text>
<path d="M 240 151 L 240 176" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="182" width="416" height="82" rx="12" fill="#ffffff" stroke="#aab7c8" stroke-width="1.5"/>
<text x="240.0" y="217.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">② effect: 서버에 저장 요청</text>
<text x="240.0" y="245.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">Store 갱신 구간 밖에서 통신</text>
<path d="M 240 265 L 240 290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="296" width="416" height="82" rx="12" fill="#fff1e1" stroke="#d4a268" stroke-width="1.5"/>
<text x="240.0" y="331.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">③ 서버 저장 실패</text>
<text x="240.0" y="359.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">실패 Action을 새로 전달</text>
<path d="M 240 379 L 240 404" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="410" width="416" height="82" rx="12" fill="#e5f4ef" stroke="#6dab97" stroke-width="1.5"/>
<text x="240.0" y="445.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">④ Store: 이전 상태로 복구</text>
<text x="240.0" y="473.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">View: 목록·배지 갱신 및 오류 표시</text>
</g></svg>
