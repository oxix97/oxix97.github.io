<svg xmlns="http://www.w3.org/2000/svg" width="480" height="542" viewBox="0 0 480 542" role="img" aria-labelledby="title desc">
<title id="title">Lazy Holder는 언제 만들까?</title><desc id="desc">최초 사용에 따른 중첩 클래스 초기화</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#475569" stroke-width="2"/></marker></defs>
<rect width="480" height="542" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b4d">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#172b4d">Lazy Holder는 언제 만들까?</text>
<rect x="32" y="68" width="416" height="82" rx="12" fill="#ffffff" stroke="#aab7c8" stroke-width="1.5"/>
<text x="240.0" y="103.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">① AppSettings 초기화</text>
<text x="240.0" y="131.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">Holder는 아직 초기화하지 않음</text>
<path d="M 240 151 L 240 176" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="182" width="416" height="82" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="217.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">② 최초 getInstance() 호출</text>
<text x="240.0" y="245.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">Holder.INSTANCE를 처음 사용</text>
<path d="M 240 265 L 240 290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="296" width="416" height="82" rx="12" fill="#e5f4ef" stroke="#6dab97" stroke-width="1.5"/>
<text x="240.0" y="331.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">③ JVM이 Holder 초기화</text>
<text x="240.0" y="359.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">AppSettings 객체를 한 번 생성</text>
<path d="M 240 379 L 240 404" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="410" width="416" height="82" rx="12" fill="#ffffff" stroke="#aab7c8" stroke-width="1.5"/>
<text x="240.0" y="445.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">④ 이후 getInstance() 호출</text>
<text x="240.0" y="473.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">만들어 둔 같은 객체를 반환</text>
</g></svg>
