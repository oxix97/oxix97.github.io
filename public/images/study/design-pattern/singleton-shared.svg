<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc">
<title id="title">여러 기능이 하나의 설정을 공유한다</title><desc id="desc">호출자가 같은 접근점을 통해 하나의 인스턴스를 얻는 구조</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#475569" stroke-width="2"/></marker></defs>
<rect width="480" height="440" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b4d">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#172b4d">여러 기능이 하나의 설정을 공유한다</text>
<rect x="28" y="75" width="200" height="72" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="128.0" y="119.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">주문 기능</text>
<rect x="252" y="75" width="200" height="72" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="352.0" y="119.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">알림 기능</text>
<path d="M 128 148 L 205 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 352 148 L 275 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="240" y="190" font-size="20" font-weight="400" text-anchor="middle" fill="#172b4d">같은 접근점에 요청</text>
<rect x="32" y="230" width="416" height="70" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="273.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">AppSettings.getInstance()</text>
<path d="M 240 302 L 240 338" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="348" width="416" height="70" rx="12" fill="#e5f4ef" stroke="#6dab97" stroke-width="1.5"/>
<text x="240.0" y="391.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">같은 AppSettings 객체를 반환</text>
</g></svg>
