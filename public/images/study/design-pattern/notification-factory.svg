<svg xmlns="http://www.w3.org/2000/svg" width="480" height="542" viewBox="0 0 480 542" role="img" aria-labelledby="title desc">
<title id="title">알림 객체를 만드는 순서</title><desc id="desc">EMAIL 요청으로 알림 객체를 선택하고 사용하는 흐름</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#475569" stroke-width="2"/></marker></defs>
<rect width="480" height="542" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b4d">
<text x="24" y="38" font-size="24" font-weight="700" text-anchor="start" fill="#172b4d">알림 객체를 만드는 순서</text>
<rect x="32" y="68" width="416" height="82" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="103.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">① 호출부: EMAIL 생성 요청</text>
<text x="240.0" y="131.0" font-size="19" font-weight="400" text-anchor="middle" fill="#172b4d">NotificationFactory.create()</text>
<path d="M 240 151 L 240 176" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="182" width="416" height="82" rx="12" fill="#e5f4ef" stroke="#6dab97" stroke-width="1.5"/>
<text x="240.0" y="217.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">② 팩토리: 채널에 맞게 생성</text>
<text x="240.0" y="245.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">new EmailNotification()</text>
<path d="M 240 265 L 240 290" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="296" width="416" height="82" rx="12" fill="#eaf2ff" stroke="#89aee5" stroke-width="1.5"/>
<text x="240.0" y="331.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">③ 호출부: Notification으로 받기</text>
<text x="240.0" y="359.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">구체적인 생성 절차는 몰라도 됨</text>
<path d="M 240 379 L 240 404" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="410" width="416" height="82" rx="12" fill="#ffffff" stroke="#aab7c8" stroke-width="1.5"/>
<text x="240.0" y="445.0" font-size="22" font-weight="600" text-anchor="middle" fill="#172b4d">④ 받은 객체의 send() 호출</text>
<text x="240.0" y="473.0" font-size="22" font-weight="400" text-anchor="middle" fill="#172b4d">이메일 알림 전송</text>
</g></svg>
