<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" role="img" aria-labelledby="title desc">
<title id="title">HTTP/2 · TCP 바이트 순서 대기</title>
<desc id="desc">하나의 TCP 연결에서 스트림 A와 B의 HTTP/2 프레임을 전송한다. TCP 상대 시퀀스 101부터 100바이트가 손실되면 201부터 도착한 B 데이터도 TCP 수신 버퍼에서 기다린다. 손실 바이트를 복구한 뒤 A와 B를 전달한다. 각 화살표의 페이로드는 100바이트로 가정한 개념도다.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:24px}.title{font-size:28px;font-weight:750}.note{font-size:23px}.axis{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}.wire{stroke-width:3;fill:none}.blue{stroke:#1d4ed8}.red{stroke:#b91c1c}.green{stroke:#047857}</style>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#1d4ed8" stroke-width="2"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#047857" stroke-width="2"/></marker></defs>
<rect width="600" height="740" rx="18" fill="#f8fafc"/>
<text class="title" x="300" y="40" text-anchor="middle">HTTP/2 · TCP 바이트 순서 대기</text>
<text x="85" y="86" text-anchor="middle">클라이언트</text>
<text x="515" y="86" text-anchor="middle">서버</text>
<path class="axis" d="M85 100V674M515 100V674"/>
<path class="wire blue" d="M85 140L515 168" marker-end="url(#blue)"/>
<text x="300" y="128" text-anchor="middle">A·B 요청 · 스트림 1·3</text>
<rect x="98" y="181" width="404" height="34" rx="7" fill="#e2e8f0"/>
<text class="note" x="300" y="206" text-anchor="middle">하나의 TCP 연결 공유</text>
<path class="wire blue" d="M515 252L85 280" marker-end="url(#blue)"/>
<text x="300" y="240" text-anchor="middle">TCP seq=1 · A 앞부분</text>
<rect x="98" y="293" width="404" height="34" rx="7" fill="#e2e8f0"/>
<text class="note" x="300" y="318" text-anchor="middle">100바이트 수신 · 위 계층 전달</text>
<path class="wire red" stroke-dasharray="8 6" d="M515 364L190 392"/>
<path class="wire red" d="M175 381l22 22m0-22-22 22"/>
<text x="300" y="352" text-anchor="middle">TCP seq=101 · A 나머지</text>
<rect x="98" y="405" width="404" height="34" rx="7" fill="#fee2e2"/>
<text class="note" x="300" y="430" text-anchor="middle">100바이트 손실 ×</text>
<path class="wire blue" d="M515 476L85 504" marker-end="url(#blue)"/>
<text x="300" y="464" text-anchor="middle">TCP seq=201 · B 데이터</text>
<rect x="98" y="517" width="404" height="34" rx="7" fill="#fee2e2"/>
<text class="note" x="300" y="542" text-anchor="middle">도착해도 TCP 버퍼에서 대기</text>
<path class="wire green" d="M515 588L85 616" marker-end="url(#green)"/>
<text x="300" y="576" text-anchor="middle">TCP seq=101 · 손실 복구</text>
<rect x="98" y="629" width="404" height="34" rx="7" fill="#e2e8f0"/>
<text class="note" x="300" y="654" text-anchor="middle">빈 구간 복구 → A·B 전달 재개</text>
<text class="note" x="300" y="718" text-anchor="middle">시간 ↓ · seq는 상대값 · ACK·TLS 생략</text>
</svg>
