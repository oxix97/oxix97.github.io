<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 852" role="img" aria-labelledby="title desc">
<title id="title">HTTP/3 · 스트림별 순서 대기</title>
<desc id="desc">하나의 QUIC 연결에서 스트림 0인 A와 스트림 4인 B를 전송한다. 각 스트림의 오프셋 1000 전까지는 수신한 상태다. 패킷 11의 A 오프셋 1100 데이터가 손실되어도 패킷 12의 B 오프셋 1000은 전달된다. A 오프셋 1200은 버퍼에서 대기하며 손실 데이터는 새 패킷 번호 14로 다시 전송한다. STREAM 데이터는 각 100바이트로 가정한다.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a;font-size:24px}.title{font-size:28px;font-weight:750}.note{font-size:23px}.axis{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}.wire{stroke-width:3;fill:none}.blue{stroke:#1d4ed8}.red{stroke:#b91c1c}.green{stroke:#047857}</style>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#1d4ed8" stroke-width="2"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#047857" stroke-width="2"/></marker></defs>
<rect width="600" height="852" rx="18" fill="#f8fafc"/>
<text class="title" x="300" y="40" text-anchor="middle">HTTP/3 · 스트림별 순서 대기</text>
<text x="85" y="86" text-anchor="middle">클라이언트</text>
<text x="515" y="86" text-anchor="middle">서버</text>
<path class="axis" d="M85 100V786M515 100V786"/>
<path class="wire blue" d="M85 140L515 168" marker-end="url(#blue)"/>
<text x="300" y="128" text-anchor="middle">A·B 요청 · 스트림 0·4</text>
<rect x="98" y="181" width="404" height="34" rx="7" fill="#e2e8f0"/>
<text class="note" x="300" y="206" text-anchor="middle">하나의 QUIC 연결 공유</text>
<path class="wire blue" d="M515 252L85 280" marker-end="url(#blue)"/>
<text x="300" y="240" text-anchor="middle">PN=10 · A offset=1000</text>
<rect x="98" y="293" width="404" height="34" rx="7" fill="#e2e8f0"/>
<text class="note" x="300" y="318" text-anchor="middle">A 앞부분 100바이트 전달</text>
<path class="wire red" stroke-dasharray="8 6" d="M515 364L190 392"/>
<path class="wire red" d="M175 381l22 22m0-22-22 22"/>
<text x="300" y="352" text-anchor="middle">PN=11 · A offset=1100</text>
<rect x="98" y="405" width="404" height="34" rx="7" fill="#fee2e2"/>
<text class="note" x="300" y="430" text-anchor="middle">A의 100바이트 손실 ×</text>
<path class="wire green" d="M515 476L85 504" marker-end="url(#green)"/>
<text x="300" y="464" text-anchor="middle">PN=12 · B offset=1000</text>
<rect x="98" y="517" width="404" height="34" rx="7" fill="#e2e8f0"/>
<text class="note" x="300" y="542" text-anchor="middle">B는 복구를 기다리지 않고 전달</text>
<path class="wire blue" d="M515 588L85 616" marker-end="url(#blue)"/>
<text x="300" y="576" text-anchor="middle">PN=13 · A offset=1200</text>
<rect x="98" y="629" width="404" height="34" rx="7" fill="#fee2e2"/>
<text class="note" x="300" y="654" text-anchor="middle">A는 빠진 구간 뒤라 버퍼 대기</text>
<path class="wire green" d="M515 700L85 728" marker-end="url(#green)"/>
<text x="300" y="688" text-anchor="middle">PN=14 · A offset=1100</text>
<rect x="98" y="741" width="404" height="34" rx="7" fill="#e2e8f0"/>
<text class="note" x="300" y="766" text-anchor="middle">새 패킷으로 복구 → A 전달 재개</text>
<text class="note" x="300" y="830" text-anchor="middle">시간 ↓ · PN은 패킷 번호 · ACK 생략</text>
</svg>
