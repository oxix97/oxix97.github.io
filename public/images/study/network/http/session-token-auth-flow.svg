<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" role="img" aria-labelledby="session-token-title session-token-desc">
  <title id="session-token-title">세션 기반 인증과 토큰 기반 인증 흐름 비교</title>
  <desc id="session-token-desc">왼쪽은 클라이언트가 세션 ID 쿠키를 보내면 서버가 세션 저장소를 조회하는 흐름이다. 오른쪽은 클라이언트가 Access Token을 Authorization 헤더로 보내면 자원 서버가 토큰을 검증하고, 만료 뒤 Refresh Token으로 새 토큰을 발급받는 흐름이다.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}.session-panel{fill:#eff6ff;stroke:#93c5fd;stroke-width:3}.token-panel{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:3}.client{fill:#0f172a}.session{fill:#1d4ed8}.token{fill:#6d28d9}.store{fill:#047857}.auth{fill:#b45309}.muted{fill:#475569}.line{fill:none;stroke:#334155;stroke-width:5}.dash{fill:none;stroke:#64748b;stroke-width:4;stroke-dasharray:12 10}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:46px;font-weight:800}.column-title{font-size:35px;font-weight:800}.box-title{font-size:27px;font-weight:800}.label{font-size:23px;font-weight:750}.detail{font-size:20px;font-weight:600}.note{font-size:23px;font-weight:750}
  </style>
  <rect class="bg" width="1400" height="1120" rx="28"/>
  <text class="client title" x="700" y="66" text-anchor="middle">로그인 상태를 누가 보관하는가</text>

  <rect class="session-panel" x="45" y="95" width="635" height="965" rx="24"/>
  <rect class="token-panel" x="720" y="95" width="635" height="965" rx="24"/>
  <text class="session column-title" x="362" y="148" text-anchor="middle">세션 기반 인증</text>
  <text class="token column-title" x="1037" y="148" text-anchor="middle">토큰 기반 인증</text>

  <rect class="client" x="115" y="190" width="230" height="70" rx="16"/>
  <text fill="#fff" class="box-title" x="230" y="235" text-anchor="middle">클라이언트</text>
  <rect class="session" x="435" y="190" width="180" height="70" rx="16"/>
  <text fill="#fff" class="box-title" x="525" y="235" text-anchor="middle">서버</text>
  <path class="dash" d="M230 278v620M525 278v620"/>

  <path class="line" d="M265 320H490" marker-end="url(#arrow)"/>
  <text class="session label" x="378" y="308" text-anchor="middle">1. 로그인 요청</text>
  <text class="muted detail" x="378" y="345" text-anchor="middle">사용자 이름 · 비밀번호</text>

  <rect class="panel" x="405" y="390" width="240" height="92" rx="16"/>
  <text class="store box-title" x="525" y="425" text-anchor="middle">세션 저장소</text>
  <text class="muted detail" x="525" y="456" text-anchor="middle">세션 ID → 사용자 상태</text>
  <path class="line" d="M525 350V385" marker-end="url(#arrow)"/>

  <path class="line" d="M490 535H265" marker-end="url(#arrow)"/>
  <text class="session label" x="378" y="522" text-anchor="middle">2. 세션 ID 전달</text>
  <text class="muted detail" x="378" y="558" text-anchor="middle">Set-Cookie: sessionId=...</text>

  <path class="line" d="M265 645H490" marker-end="url(#arrow)"/>
  <text class="session label" x="378" y="632" text-anchor="middle">3. 보호 자원 요청</text>
  <text class="muted detail" x="378" y="668" text-anchor="middle">Cookie: sessionId=...</text>

  <path class="line" d="M525 690V725" marker-end="url(#arrow)"/>
  <rect class="panel" x="405" y="735" width="240" height="86" rx="16"/>
  <text class="store label" x="525" y="770" text-anchor="middle">세션 조회</text>
  <text class="muted detail" x="525" y="800" text-anchor="middle">유효성 · 사용자 · 권한</text>

  <rect class="panel" x="105" y="920" width="520" height="98" rx="18"/>
  <text class="session note" x="365" y="960" text-anchor="middle">서버가 로그인 상태를 보관한다</text>
  <text class="muted detail" x="365" y="993" text-anchor="middle">로그아웃: 저장소의 세션 제거</text>

  <rect class="client" x="790" y="190" width="210" height="70" rx="16"/>
  <text fill="#fff" class="box-title" x="895" y="235" text-anchor="middle">클라이언트</text>
  <rect class="token" x="1085" y="190" width="205" height="70" rx="16"/>
  <text fill="#fff" class="box-title" x="1188" y="235" text-anchor="middle">자원 서버</text>
  <path class="dash" d="M895 278v620M1188 278v620"/>

  <path class="line" d="M930 320H1153" marker-end="url(#arrow)"/>
  <text class="token label" x="1042" y="308" text-anchor="middle">1. 보호 자원 요청</text>
  <text class="muted detail" x="1042" y="345" text-anchor="middle">Authorization: Bearer ...</text>

  <rect class="panel" x="1050" y="390" width="275" height="112" rx="16"/>
  <text class="token box-title" x="1188" y="428" text-anchor="middle">Access Token 검증</text>
  <text class="muted detail" x="1188" y="462" text-anchor="middle">서명 · 발급자 · 대상</text>
  <text class="muted detail" x="1188" y="488" text-anchor="middle">만료 · 권한 클레임</text>
  <path class="line" d="M1188 350V385" marker-end="url(#arrow)"/>

  <path class="line" d="M1153 560H930" marker-end="url(#arrow)"/>
  <text class="token label" x="1042" y="548" text-anchor="middle">2. 응답</text>
  <text class="muted detail" x="1042" y="584" text-anchor="middle">유효하면 자원 반환</text>

  <rect class="panel" x="770" y="630" width="540" height="250" rx="18"/>
  <text class="auth box-title" x="1040" y="670" text-anchor="middle">Access Token 만료 뒤 갱신</text>
  <rect class="client" x="790" y="700" width="160" height="55" rx="14"/>
  <text fill="#fff" class="label" x="870" y="736" text-anchor="middle">클라이언트</text>
  <rect class="auth" x="1130" y="700" width="160" height="55" rx="14"/>
  <text fill="#fff" class="label" x="1210" y="736" text-anchor="middle">인증 서버</text>
  <path class="line" d="M960 790H1120" marker-end="url(#arrow)"/>
  <text class="muted detail" x="1040" y="781" text-anchor="middle">Refresh Token</text>
  <path class="line" d="M1120 825H960" marker-end="url(#arrow)"/>
  <text class="muted detail" x="1040" y="860" text-anchor="middle">새 Access Token · 새 Refresh Token</text>

  <rect class="panel" x="780" y="920" width="520" height="98" rx="18"/>
  <text class="token note" x="1040" y="960" text-anchor="middle">클라이언트가 Access Token을 보낸다</text>
  <text class="muted detail" x="1040" y="993" text-anchor="middle">회전 · 폐기를 쓰면 인증 서버도 상태 보관</text>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#334155"/></marker>
  </defs>
</svg>
