<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" role="img" aria-labelledby="tls-1-3-handshake-title tls-1-3-handshake-desc">
  <title id="tls-1-3-handshake-title">TLS 1.3 인증서 기반 전체 핸드셰이크</title>
  <desc id="tls-1-3-handshake-desc">클라이언트와 서버가 ClientHello와 ServerHello로 ECDHE key share를 교환하고, 서버가 EncryptedExtensions, Certificate, CertificateVerify, Finished를 보낸 뒤 클라이언트 Finished와 암호화된 애플리케이션 데이터로 이어지는 과정.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.blue{fill:#1d4ed8}.violet{fill:#6d28d9}.green{fill:#047857}.amber{fill:#b45309}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}.line{fill:none;stroke:#334155;stroke-width:5}.dash{fill:none;stroke:#64748b;stroke-width:4;stroke-dasharray:12 10}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:48px;font-weight:800}.party{font-size:38px;font-weight:800}.message{font-size:29px;font-weight:800}.detail{font-size:23px;font-weight:650}.phase{font-size:27px;font-weight:800}
  </style>
  <rect class="bg" width="1200" height="1080" rx="28"/>
  <text class="ink title" x="55" y="68">TLS 1.3 전체 1-RTT 핸드셰이크</text>

  <rect class="blue" x="55" y="95" width="360" height="66" rx="16"/>
  <text fill="#fff" class="party" x="235" y="141" text-anchor="middle">클라이언트</text>
  <rect class="green" x="785" y="95" width="360" height="66" rx="16"/>
  <text fill="#fff" class="party" x="965" y="141" text-anchor="middle">서버</text>
  <path class="dash" d="M235 175v850M965 175v850"/>

  <path class="line" d="M275 220H925" marker-end="url(#arrow)"/>
  <text class="blue message" x="600" y="210" text-anchor="middle">ClientHello</text>
  <text class="muted detail" x="600" y="250" text-anchor="middle">supported_versions · cipher_suites · key_share</text>

  <path class="line" d="M925 320H275" marker-end="url(#arrow)"/>
  <text class="green message" x="600" y="309" text-anchor="middle">ServerHello</text>
  <text class="muted detail" x="600" y="350" text-anchor="middle">선택한 버전 · cipher suite · 서버 key_share</text>

  <rect class="panel" x="365" y="382" width="470" height="70" rx="18"/>
  <text class="violet phase" x="600" y="412" text-anchor="middle">ECDHE 공유 비밀 계산</text>
  <text class="muted detail" x="600" y="440" text-anchor="middle">HKDF로 핸드셰이크 트래픽 키 파생</text>

  <path class="line" d="M925 500H275" marker-end="url(#arrow)"/>
  <text class="violet message" x="600" y="489" text-anchor="middle">EncryptedExtensions</text>
  <text class="muted detail" x="600" y="528" text-anchor="middle">여기부터 핸드셰이크 키로 보호</text>

  <path class="line" d="M925 590H275" marker-end="url(#arrow)"/>
  <text class="green message" x="600" y="579" text-anchor="middle">Certificate</text>
  <text class="muted detail" x="600" y="618" text-anchor="middle">서버 인증서와 중간 인증서 체인</text>

  <path class="line" d="M925 680H275" marker-end="url(#arrow)"/>
  <text class="green message" x="600" y="669" text-anchor="middle">CertificateVerify</text>
  <text class="muted detail" x="600" y="708" text-anchor="middle">인증서 개인키로 transcript 서명</text>

  <path class="line" d="M925 770H275" marker-end="url(#arrow)"/>
  <text class="green message" x="600" y="759" text-anchor="middle">Finished</text>
  <text class="muted detail" x="600" y="798" text-anchor="middle">서버 핸드셰이크 transcript와 키 확인</text>

  <path class="line" d="M275 860H925" marker-end="url(#arrow)"/>
  <text class="blue message" x="600" y="849" text-anchor="middle">Finished</text>
  <text class="muted detail" x="600" y="888" text-anchor="middle">클라이언트 핸드셰이크 확인</text>

  <rect class="panel" x="365" y="925" width="470" height="72" rx="18"/>
  <text class="violet phase" x="600" y="956" text-anchor="middle">애플리케이션 트래픽 키 사용</text>
  <text class="muted detail" x="600" y="985" text-anchor="middle">HTTP 데이터는 AEAD로 기밀성과 무결성 보호</text>
  <path class="line" d="M275 1030H925" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#334155"/></marker>
    <marker id="arrow-start" markerWidth="11" markerHeight="11" refX="1" refY="4" orient="auto"><path d="M10,0 L10,8 L0,4 z" fill="#334155"/></marker>
  </defs>
</svg>
