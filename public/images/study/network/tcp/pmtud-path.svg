<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="pmtud-path-title pmtud-path-desc">
  <title id="pmtud-path-title">PMTUD가 경로 MTU 1400을 찾는 과정</title>
  <desc id="pmtud-path-desc">송신자와 수신자 사이의 1500바이트 링크와 1400바이트 링크에서 큰 패킷 시도, ICMP 피드백, 1400바이트 이하 재전송을 차례로 표시한 그림.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.blue{fill:#1d4ed8}.violet{fill:#6d28d9}.green{fill:#047857}.amber{fill:#92400e}.line{fill:none;stroke:#334155;stroke-width:5}.card{stroke:#cbd5e1;stroke-width:2}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:52px;font-weight:800}.label{fill:#fff;font-size:42px;font-weight:800}.step{font-size:42px;font-weight:800}
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text class="ink title" x="55" y="72">PMTUD: 경로 MTU 찾기</text>

  <rect class="blue" x="55" y="110" width="230" height="90" rx="18"/>
  <text class="label" x="170" y="169" text-anchor="middle">송신자</text>
  <rect class="violet" x="345" y="110" width="220" height="90" rx="18"/>
  <text class="label" x="455" y="169" text-anchor="middle">MTU 1500</text>
  <rect class="amber" x="635" y="110" width="220" height="90" rx="18"/>
  <text class="label" x="745" y="169" text-anchor="middle">MTU 1400</text>
  <rect class="green" x="915" y="110" width="230" height="90" rx="18"/>
  <text class="label" x="1030" y="169" text-anchor="middle">수신자</text>
  <path class="line" d="M285 155h60m220 0h70m220 0h60" marker-end="url(#arrow)"/>

  <rect class="card" x="55" y="255" width="1090" height="95" rx="18" fill="#eff6ff"/>
  <text class="ink step" x="95" y="317">1 · 1500 B 전송</text>
  <path class="line" d="M745 200v35" marker-end="url(#arrow)"/>

  <rect class="card" x="55" y="390" width="1090" height="95" rx="18" fill="#fff7ed"/>
  <text class="ink step" x="95" y="452">2 · ICMP: MTU 1400</text>
  <path class="line" d="M745 350v20H170v20" marker-end="url(#arrow)"/>

  <rect class="card" x="55" y="525" width="1090" height="95" rx="18" fill="#ecfdf5"/>
  <text class="ink step" x="95" y="587">3 · 1400 B 이하 재전송</text>
  <path class="line" d="M170 485v20h860v20" marker-end="url(#arrow)"/>

  <rect class="violet" x="330" y="645" width="540" height="60" rx="18"/>
  <text class="label" x="600" y="690" text-anchor="middle">경로 MTU = 1400 B</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
</svg>
