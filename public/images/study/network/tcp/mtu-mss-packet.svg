<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="mtu-mss-packet-title mtu-mss-packet-desc">
  <title id="mtu-mss-packet-title">MTU 1500과 MSS 1460의 조건부 예시</title>
  <desc id="mtu-mss-packet-desc">옵션 없는 IPv4와 TCP 헤더를 가정해 1500바이트 IP 패킷을 IPv4 헤더 20바이트, TCP 헤더 20바이트, TCP 데이터 1460바이트로 나눈 그림.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.blue{fill:#1d4ed8}.violet{fill:#6d28d9}.green{fill:#047857}.amber{fill:#92400e}.border{stroke:#cbd5e1;stroke-width:2}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:52px;font-weight:800}.label{fill:#fff;font-size:42px;font-weight:800}.body{font-size:42px;font-weight:800}
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text class="ink title" x="55" y="72">MTU와 MSS의 관계</text>

  <rect class="blue" x="55" y="105" width="1090" height="90" rx="18"/>
  <text class="label" x="90" y="165">MTU 1500 B</text>
  <text class="label" x="1110" y="165" text-anchor="end">IP 패킷 전체</text>

  <rect class="green" x="55" y="225" width="1090" height="165" rx="18"/>
  <rect class="blue" x="55" y="225" width="16" height="165"/>
  <rect class="violet" x="71" y="225" width="16" height="165"/>
  <rect class="border" x="55" y="225" width="1090" height="165" rx="18" fill="none"/>
  <path d="M63 390v30H220" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M79 390v30H550" fill="none" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>

  <rect class="blue" x="55" y="445" width="330" height="135" rx="18"/>
  <text class="label" x="220" y="498" text-anchor="middle">IPv4 헤더</text>
  <text class="label" x="220" y="553" text-anchor="middle">20 B</text>
  <rect class="violet" x="435" y="445" width="330" height="135" rx="18"/>
  <text class="label" x="600" y="498" text-anchor="middle">TCP 헤더</text>
  <text class="label" x="600" y="553" text-anchor="middle">20 B</text>
  <rect class="green" x="815" y="445" width="330" height="135" rx="18"/>
  <text class="label" x="980" y="498" text-anchor="middle">TCP 데이터</text>
  <text class="label" x="980" y="553" text-anchor="middle">1460 B</text>

  <rect class="green" x="55" y="605" width="375" height="95" rx="18"/>
  <text class="label" x="242" y="667" text-anchor="middle">MSS = 1460 B</text>
  <rect class="amber" x="455" y="595" width="690" height="110" rx="18"/>
  <text class="label" x="485" y="641">옵션 없는 IPv4·TCP 예시</text>
  <text class="label" x="485" y="689">헤더·터널 조건에 따라 달라짐</text>

  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
</svg>
