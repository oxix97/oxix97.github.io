<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="tcp-three-way-handshake-title tcp-three-way-handshake-desc">
  <title id="tcp-three-way-handshake-title">TCP 3-way handshake 상태 전이</title>
  <desc id="tcp-three-way-handshake-desc">연결 시작 측과 수신 측의 생명선 사이에서 SYN, SYN-ACK, ACK가 순서대로 오가며 양쪽이 ESTABLISHED가 되는 과정.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.blue{fill:#1d4ed8}.violet{fill:#6d28d9}.green{fill:#047857}.amber{fill:#92400e}.danger{fill:#b91c1c}.line{fill:none;stroke:#334155;stroke-width:4}.dash{fill:none;stroke:#64748b;stroke-width:4;stroke-dasharray:10 10}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:42px;font-weight:800}.subtitle{font-size:24px}.name{font-size:30px;font-weight:800}.label{font-size:42px;font-weight:800}.sequence{font-size:42px;font-weight:700}.chip{font-size:42px;font-weight:800}.note{font-size:23px}
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text class="ink title" x="60" y="62">TCP 연결 수립: 3-way handshake</text>
  <text class="muted subtitle" x="60" y="98">시간은 위에서 아래로 흐르고, 양쪽은 독립적인 ISN을 서로 확인한다.</text>
  <rect class="blue" x="105" y="122" width="310" height="68" rx="16"/><text fill="#fff" class="name" x="260" y="165" text-anchor="middle">연결 시작 측</text>
  <rect class="green" x="785" y="122" width="310" height="68" rx="16"/><text fill="#fff" class="name" x="940" y="165" text-anchor="middle">수신 측</text>
  <path class="dash" d="M260 205v410M940 205v410"/>
  <rect x="70" y="218" width="380" height="70" rx="35" fill="#e2e8f0"/><text class="ink chip" x="260" y="265" text-anchor="middle">CLOSED</text>
  <rect x="750" y="218" width="380" height="70" rx="35" fill="#fef3c7"/><text class="ink chip" x="940" y="265" text-anchor="middle">LISTEN</text>
  <path class="line" d="M470 315H730" marker-end="url(#arrow)"/><text class="blue label" x="600" y="307" text-anchor="middle">SYN</text><text class="ink sequence" x="600" y="355" text-anchor="middle">seq=x</text>
  <rect x="70" y="378" width="380" height="70" rx="35" fill="#ede9fe"/><text class="ink chip" x="260" y="425" text-anchor="middle">SYN_SENT</text>
  <rect x="750" y="378" width="380" height="70" rx="35" fill="#ede9fe"/><text class="ink chip" x="940" y="425" text-anchor="middle">SYN_RECEIVED</text>
  <path class="line" d="M730 475H470" marker-end="url(#arrow)"/><text class="violet label" x="600" y="467" text-anchor="middle">SYN-ACK</text><text class="ink sequence" x="600" y="515" text-anchor="middle">seq=y · ack=x+1</text>
  <path class="line" d="M470 555H730" marker-end="url(#arrow)"/><text class="green label" x="600" y="547" text-anchor="middle">ACK</text><text class="ink sequence" x="600" y="595" text-anchor="middle">ack=y+1</text>
  <rect x="70" y="620" width="380" height="70" rx="35" fill="#dcfce7"/><text class="ink chip" x="260" y="667" text-anchor="middle">ESTABLISHED</text>
  <rect x="750" y="620" width="380" height="70" rx="35" fill="#dcfce7"/><text class="ink chip" x="940" y="667" text-anchor="middle">ESTABLISHED</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#334155"/></marker></defs>
</svg>
