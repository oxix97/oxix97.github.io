<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="tcp-three-way-handshake-title tcp-three-way-handshake-desc">
  <title id="tcp-three-way-handshake-title">TCP 3-way handshake 상태 전이</title>
  <desc id="tcp-three-way-handshake-desc">연결 시작 측과 수신 측의 생명선 사이에서 SYN, SYN-ACK, ACK가 순서대로 오가며 양쪽이 ESTABLISHED가 되는 과정.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.blue{fill:#2563eb}.violet{fill:#7c3aed}.green{fill:#059669}.amber{fill:#d97706}.danger{fill:#dc2626}.line{fill:none;stroke:#334155;stroke-width:3}.dash{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:9 9}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:34px;font-weight:800}.subtitle{font-size:19px}.name{font-size:22px;font-weight:800}.label{font-size:18px;font-weight:800}.body{font-size:17px}.chip{font-size:16px;font-weight:800}
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text class="ink title" x="70" y="68">TCP 연결 수립: 3-way handshake</text>
  <text class="muted subtitle" x="70" y="102">시간은 위에서 아래로 흐르고, 양쪽은 독립적인 ISN을 서로 확인한다.</text>
  <rect class="blue" x="180" y="138" width="240" height="64" rx="16"/>
  <text fill="#fff" class="name" x="300" y="178" text-anchor="middle">연결 시작 측</text>
  <rect class="green" x="780" y="138" width="240" height="64" rx="16"/>
  <text class="ink name" x="900" y="178" text-anchor="middle">수신 측</text>
  <path class="dash" d="M300 220v400M900 220v400"/>
  <rect x="210" y="234" width="180" height="40" rx="20" fill="#e2e8f0"/><text class="ink chip" x="300" y="260" text-anchor="middle">CLOSED</text>
  <rect x="810" y="234" width="180" height="40" rx="20" fill="#fef3c7"/><text class="ink chip" x="900" y="260" text-anchor="middle">LISTEN</text>
  <path class="line" d="M320 302H858" marker-end="url(#arrow)"/>
  <rect x="470" y="277" width="160" height="50" rx="12" fill="#dbeafe"/>
  <text class="blue label" x="550" y="299" text-anchor="middle">SYN</text><text class="ink body" x="550" y="319" text-anchor="middle">seq=x</text>
  <rect x="210" y="348" width="180" height="40" rx="20" fill="#ede9fe"/><text class="violet chip" x="300" y="374" text-anchor="middle">SYN_SENT</text>
  <rect x="810" y="348" width="180" height="40" rx="20" fill="#ede9fe"/><text class="violet chip" x="900" y="374" text-anchor="middle">SYN_RECEIVED</text>
  <path class="line" d="M880 430H342" marker-end="url(#arrow)"/>
  <rect x="423" y="395" width="254" height="70" rx="12" fill="#f5f3ff"/>
  <text class="violet label" x="550" y="420" text-anchor="middle">SYN-ACK</text><text class="ink body" x="550" y="445" text-anchor="middle">seq=y · ack=x+1</text>
  <path class="line" d="M320 520H858" marker-end="url(#arrow)"/>
  <rect x="455" y="495" width="190" height="50" rx="12" fill="#dcfce7"/>
  <text class="green label" x="550" y="517" text-anchor="middle">ACK</text><text class="ink body" x="550" y="537" text-anchor="middle">ack=y+1</text>
  <rect x="210" y="576" width="180" height="40" rx="20" fill="#dcfce7"/><text class="green chip" x="300" y="602" text-anchor="middle">ESTABLISHED</text>
  <rect x="810" y="576" width="180" height="40" rx="20" fill="#dcfce7"/><text class="green chip" x="900" y="602" text-anchor="middle">ESTABLISHED</text>
  <rect x="145" y="650" width="910" height="42" rx="12" fill="#fff7ed"/>
  <text class="amber" x="170" y="677" font-size="16" font-weight="800">핵심:</text><text class="muted" x="230" y="677" font-size="16">SYN은 시퀀스 공간 한 칸을 소비하므로 상대 SYN의 확인은 항상 ISN+1이다.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
</svg>
