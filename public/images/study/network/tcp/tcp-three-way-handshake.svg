<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="tcp-three-way-handshake-title tcp-three-way-handshake-desc">
  <title id="tcp-three-way-handshake-title">TCP 3-way handshake 상태 전이</title>
  <desc id="tcp-three-way-handshake-desc">연결 시작 측과 수신 측 사이에서 SYN, SYN-ACK, ACK가 순서대로 오가며 양쪽이 ESTABLISHED가 되는 과정.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.blue{fill:#1d4ed8}.violet{fill:#6d28d9}.green{fill:#047857}.amber{fill:#92400e}.danger{fill:#b91c1c}.line{fill:none;stroke:#334155;stroke-width:5}.dash{fill:none;stroke:#64748b;stroke-width:5;stroke-dasharray:12 12}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:52px;font-weight:800}.name,.label,.sequence,.chip{font-size:42px;font-weight:800}
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text class="ink title" x="55" y="70">TCP 연결 수립: 3-way handshake</text>
  <rect class="blue" x="40" y="90" width="420" height="70" rx="16"/>
  <text fill="#fff" class="name" x="250" y="140" text-anchor="middle">연결 시작 측</text>
  <rect class="green" x="740" y="90" width="420" height="70" rx="16"/>
  <text fill="#fff" class="name" x="950" y="140" text-anchor="middle">수신 측</text>
  <path class="dash" d="M250 170v530M950 170v530"/>

  <rect x="40" y="175" width="420" height="60" rx="30" fill="#e2e8f0"/>
  <text class="ink chip" x="250" y="219" text-anchor="middle">CLOSED</text>
  <rect x="740" y="175" width="420" height="60" rx="30" fill="#fef3c7"/>
  <text class="ink chip" x="950" y="219" text-anchor="middle">LISTEN</text>

  <path class="line" d="M480 285H720" marker-end="url(#arrow)"/>
  <text class="blue label" x="600" y="278" text-anchor="middle">SYN</text>
  <text class="ink sequence" x="600" y="330" text-anchor="middle">seq=x</text>

  <rect x="40" y="350" width="420" height="60" rx="30" fill="#ede9fe"/>
  <text class="ink chip" x="250" y="394" text-anchor="middle">SYN_SENT</text>
  <rect x="740" y="350" width="420" height="60" rx="30" fill="#ede9fe"/>
  <text class="ink chip" x="950" y="394" text-anchor="middle">SYN_RECEIVED</text>

  <path class="line" d="M720 455H480" marker-end="url(#arrow)"/>
  <text class="violet label" x="600" y="448" text-anchor="middle">SYN-ACK</text>
  <text class="ink sequence" x="600" y="495" text-anchor="middle">seq=y · ack=x+1</text>

  <path class="line" d="M480 550H720" marker-end="url(#arrow)"/>
  <text class="green label" x="600" y="543" text-anchor="middle">ACK</text>
  <text class="ink sequence" x="600" y="590" text-anchor="middle">ack=y+1</text>

  <rect x="40" y="625" width="420" height="70" rx="35" fill="#dcfce7"/>
  <text class="ink chip" x="250" y="674" text-anchor="middle">ESTABLISHED</text>
  <rect x="740" y="625" width="420" height="70" rx="35" fill="#dcfce7"/>
  <text class="ink chip" x="950" y="674" text-anchor="middle">ESTABLISHED</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#334155"/></marker></defs>
</svg>
