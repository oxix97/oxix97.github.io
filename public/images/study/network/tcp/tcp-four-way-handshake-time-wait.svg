<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="tcp-four-way-handshake-time-wait-title tcp-four-way-handshake-time-wait-desc">
  <title id="tcp-four-way-handshake-time-wait-title">TCP 4-way handshake와 TIME_WAIT 상태 전이</title>
  <desc id="tcp-four-way-handshake-time-wait-desc">종료 시작 측과 상대 측 사이에서 FIN, ACK, FIN, 마지막 ACK가 오가고, 시작 측이 TIME_WAIT에 머문 뒤 CLOSED가 되는 과정.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.blue{fill:#2563eb}.violet{fill:#7c3aed}.green{fill:#059669}.amber{fill:#d97706}.danger{fill:#dc2626}.line{fill:none;stroke:#334155;stroke-width:3}.dash{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:9 9}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:34px;font-weight:800}.subtitle{font-size:19px}.name{font-size:22px;font-weight:800}.label{font-size:17px;font-weight:800}.body{font-size:15px}.chip{font-size:14px;font-weight:800}
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text class="ink title" x="70" y="64">TCP 연결 종료: 4-way handshake와 TIME_WAIT</text>
  <text class="muted subtitle" x="70" y="96">양방향 스트림은 독립적으로 닫히므로 ACK와 FIN은 분리될 수 있다.</text>
  <rect class="blue" x="165" y="122" width="250" height="60" rx="16"/><text fill="#fff" class="name" x="290" y="160" text-anchor="middle">종료 시작 측</text>
  <rect class="green" x="785" y="122" width="250" height="60" rx="16"/><text class="ink name" x="910" y="160" text-anchor="middle">상대 측</text>
  <path class="dash" d="M290 197v376M910 197v376"/>
  <rect x="198" y="208" width="184" height="32" rx="16" fill="#dcfce7"/><text class="green chip" x="290" y="230" text-anchor="middle">ESTABLISHED</text>
  <rect x="818" y="208" width="184" height="32" rx="16" fill="#dcfce7"/><text class="green chip" x="910" y="230" text-anchor="middle">ESTABLISHED</text>
  <path class="line" d="M310 270H890" marker-end="url(#arrow)"/><rect x="525" y="246" width="150" height="48" rx="12" fill="#fee2e2"/><text class="danger label" x="600" y="267" text-anchor="middle">FIN</text><text class="ink body" x="600" y="284" text-anchor="middle">송신 종료 요청</text>
  <rect x="190" y="312" width="200" height="32" rx="16" fill="#ede9fe"/><text class="violet chip" x="290" y="334" text-anchor="middle">FIN_WAIT_1</text>
  <rect x="810" y="312" width="200" height="32" rx="16" fill="#fef3c7"/><text class="amber chip" x="910" y="334" text-anchor="middle">CLOSE_WAIT</text>
  <path class="line" d="M890 376H310" marker-end="url(#arrow)"/><rect x="525" y="352" width="150" height="48" rx="12" fill="#dbeafe"/><text class="blue label" x="600" y="373" text-anchor="middle">ACK</text><text class="ink body" x="600" y="390" text-anchor="middle">FIN 수신 확인</text>
  <rect x="190" y="418" width="200" height="32" rx="16" fill="#ede9fe"/><text class="violet chip" x="290" y="440" text-anchor="middle">FIN_WAIT_2</text>
  <text class="muted body" x="910" y="440" text-anchor="middle">애플리케이션이 남은 데이터 처리</text>
  <path class="line" d="M890 482H310" marker-end="url(#arrow)"/><rect x="525" y="458" width="150" height="48" rx="12" fill="#fee2e2"/><text class="danger label" x="600" y="479" text-anchor="middle">FIN</text><text class="ink body" x="600" y="496" text-anchor="middle">상대 송신 종료</text>
  <rect x="810" y="524" width="200" height="32" rx="16" fill="#ede9fe"/><text class="violet chip" x="910" y="546" text-anchor="middle">LAST_ACK</text>
  <path class="line" d="M310 590H890" marker-end="url(#arrow)"/><rect x="525" y="566" width="150" height="48" rx="12" fill="#dbeafe"/><text class="blue label" x="600" y="587" text-anchor="middle">마지막 ACK</text><text class="ink body" x="600" y="604" text-anchor="middle">FIN 확인</text>
  <rect x="118" y="630" width="344" height="72" rx="14" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2"/>
  <text class="amber label" x="140" y="655">TIME_WAIT</text><text class="muted body" x="140" y="678">마지막 ACK 재전송 · 지연 세그먼트 만료</text><text class="muted body" x="140" y="694">→ CLOSED</text>
  <rect x="818" y="630" width="184" height="32" rx="16" fill="#e2e8f0"/><text class="ink chip" x="910" y="652" text-anchor="middle">CLOSED</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
</svg>
