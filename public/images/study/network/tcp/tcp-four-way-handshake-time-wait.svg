<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="tcp-four-way-handshake-time-wait-title tcp-four-way-handshake-time-wait-desc">
  <title id="tcp-four-way-handshake-time-wait-title">TCP 4-way handshake와 TIME_WAIT 상태 전이</title>
  <desc id="tcp-four-way-handshake-time-wait-desc">종료 시작 측과 상대 측 사이에서 FIN, ACK, FIN, 마지막 ACK가 오가고 시작 측이 TIME_WAIT을 거쳐 CLOSED가 되는 과정.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.blue{fill:#1d4ed8}.violet{fill:#6d28d9}.green{fill:#047857}.amber{fill:#92400e}.danger{fill:#b91c1c}.line{fill:none;stroke:#334155;stroke-width:5}.dash{fill:none;stroke:#64748b;stroke-width:5;stroke-dasharray:12 12}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:52px;font-weight:800}.name,.label,.chip{font-size:42px;font-weight:800}
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text class="ink title" x="55" y="65">TCP 연결 종료: 4-way handshake</text>
  <rect class="blue" x="40" y="80" width="420" height="65" rx="16"/>
  <text fill="#fff" class="name" x="250" y="127" text-anchor="middle">종료 시작 측</text>
  <rect class="green" x="740" y="80" width="420" height="65" rx="16"/>
  <text fill="#fff" class="name" x="950" y="127" text-anchor="middle">상대 측</text>
  <path class="dash" d="M250 150v555M950 150v555"/>

  <rect x="40" y="150" width="420" height="55" rx="28" fill="#dcfce7"/>
  <text class="ink chip" x="250" y="192" text-anchor="middle">ESTABLISHED</text>
  <rect x="740" y="150" width="420" height="55" rx="28" fill="#dcfce7"/>
  <text class="ink chip" x="950" y="192" text-anchor="middle">ESTABLISHED</text>

  <path class="line" d="M480 250H720" marker-end="url(#arrow)"/>
  <text class="danger label" x="600" y="243" text-anchor="middle">FIN</text>
  <rect x="40" y="265" width="420" height="55" rx="28" fill="#ede9fe"/>
  <text class="ink chip" x="250" y="307" text-anchor="middle">FIN_WAIT_1</text>
  <rect x="740" y="265" width="420" height="55" rx="28" fill="#fef3c7"/>
  <text class="ink chip" x="950" y="307" text-anchor="middle">CLOSE_WAIT</text>

  <path class="line" d="M720 350H480" marker-end="url(#arrow)"/>
  <text class="blue label" x="600" y="343" text-anchor="middle">ACK</text>
  <rect x="40" y="365" width="420" height="55" rx="28" fill="#ede9fe"/>
  <text class="ink chip" x="250" y="407" text-anchor="middle">FIN_WAIT_2</text>

  <path class="line" d="M720 450H480" marker-end="url(#arrow)"/>
  <text class="danger label" x="600" y="443" text-anchor="middle">FIN</text>
  <rect x="740" y="465" width="420" height="55" rx="28" fill="#ede9fe"/>
  <text class="ink chip" x="950" y="507" text-anchor="middle">LAST_ACK</text>

  <path class="line" data-message="final-ack" d="M480 550H720" marker-end="url(#arrow)"/>
  <text class="blue label" x="600" y="543" text-anchor="middle">마지막 ACK</text>

  <rect data-geometry="time-wait" x="40" y="575" width="420" height="55" rx="28" fill="#fef3c7"/>
  <text data-geometry-label="time-wait" class="amber chip" x="250" y="617" text-anchor="middle">TIME_WAIT</text>
  <rect data-geometry="peer-closed" x="740" y="575" width="420" height="55" rx="28" fill="#e2e8f0"/>
  <text data-geometry-label="peer-closed" class="ink chip" x="950" y="617" text-anchor="middle">CLOSED</text>
  <rect data-geometry="active-closed" x="40" y="650" width="420" height="55" rx="28" fill="#e2e8f0"/>
  <text data-geometry-label="active-closed" class="ink chip" x="250" y="692" text-anchor="middle">CLOSED</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#334155"/></marker></defs>
</svg>
