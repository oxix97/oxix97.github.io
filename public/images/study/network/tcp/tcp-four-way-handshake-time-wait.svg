<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="tcp-four-way-handshake-time-wait-title tcp-four-way-handshake-time-wait-desc">
  <title id="tcp-four-way-handshake-time-wait-title">TCP 4-way handshake와 TIME_WAIT 상태 전이</title>
  <desc id="tcp-four-way-handshake-time-wait-desc">종료 시작 측과 상대 측 사이에서 FIN, ACK, FIN, 마지막 ACK가 오가고, 시작 측이 TIME_WAIT에 머문 뒤 CLOSED가 되는 과정.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.blue{fill:#1d4ed8}.violet{fill:#6d28d9}.green{fill:#047857}.amber{fill:#92400e}.danger{fill:#b91c1c}.line{fill:none;stroke:#334155;stroke-width:4}.dash{fill:none;stroke:#64748b;stroke-width:4;stroke-dasharray:10 10}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:40px;font-weight:800}.subtitle{font-size:23px}.name{font-size:30px;font-weight:800}.label{font-size:42px;font-weight:800}.chip{font-size:42px;font-weight:800}.note{font-size:22px;font-weight:700}
  </style>
  <rect class="bg" width="1200" height="780" rx="28"/>
  <text class="ink title" x="60" y="58">TCP 연결 종료: 4-way handshake와 TIME_WAIT</text>
  <text class="muted subtitle" x="60" y="94">시간은 위에서 아래로 흐르고, 양방향 스트림은 독립적으로 닫힌다.</text>
  <rect class="blue" x="65" y="110" width="380" height="64" rx="16"/><text fill="#fff" class="name" x="255" y="151" text-anchor="middle">종료 시작 측</text>
  <rect class="green" x="755" y="110" width="380" height="64" rx="16"/><text fill="#fff" class="name" x="945" y="151" text-anchor="middle">상대 측</text>
  <path class="dash" d="M255 185v390M945 185v390"/>
  <rect x="65" y="190" width="380" height="62" rx="31" fill="#dcfce7"/><text class="ink chip" x="255" y="233" text-anchor="middle">ESTABLISHED</text>
  <rect x="755" y="190" width="380" height="62" rx="31" fill="#dcfce7"/><text class="ink chip" x="945" y="233" text-anchor="middle">ESTABLISHED</text>
  <path class="line" d="M465 278H735" marker-end="url(#arrow)"/><text class="danger label" x="600" y="270" text-anchor="middle">FIN</text>
  <rect x="65" y="296" width="380" height="62" rx="31" fill="#ede9fe"/><text class="ink chip" x="255" y="339" text-anchor="middle">FIN_WAIT_1</text>
  <rect x="755" y="296" width="380" height="62" rx="31" fill="#fef3c7"/><text class="ink chip" x="945" y="339" text-anchor="middle">CLOSE_WAIT</text>
  <path class="line" d="M735 384H465" marker-end="url(#arrow)"/><text class="blue label" x="600" y="376" text-anchor="middle">ACK</text>
  <rect x="65" y="402" width="380" height="62" rx="31" fill="#ede9fe"/><text class="ink chip" x="255" y="445" text-anchor="middle">FIN_WAIT_2</text>
  <text class="muted note" x="945" y="438" text-anchor="middle">애플리케이션이 남은 데이터 처리</text>
  <path class="line" d="M735 490H465" marker-end="url(#arrow)"/><text class="danger label" x="600" y="482" text-anchor="middle">FIN</text>
  <rect x="755" y="508" width="380" height="62" rx="31" fill="#ede9fe"/><text class="ink chip" x="945" y="551" text-anchor="middle">LAST_ACK</text>
  <path class="line" d="M465 594H735" marker-end="url(#arrow)"/><text class="blue label" x="600" y="586" text-anchor="middle">마지막 ACK</text>
  <rect x="55" y="604" width="400" height="150" rx="18" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2"/>
  <text class="amber chip" x="255" y="652" text-anchor="middle">TIME_WAIT</text><text class="muted note" x="255" y="689" text-anchor="middle">마지막 ACK 재전송 · 지연 세그먼트 만료</text><text class="ink chip" x="255" y="735" text-anchor="middle">CLOSED</text>
  <rect x="755" y="640" width="380" height="62" rx="31" fill="#e2e8f0"/><text class="ink chip" x="945" y="683" text-anchor="middle">CLOSED</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#334155"/></marker></defs>
</svg>
