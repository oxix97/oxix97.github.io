<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="tcp-ip-layer-stack-title tcp-ip-layer-stack-desc">
  <title id="tcp-ip-layer-stack-title">TCP/IP 4계층과 전송 단위</title>
  <desc id="tcp-ip-layer-stack-desc">애플리케이션, 전송, 인터넷, 네트워크 접근 계층을 위에서 아래로 배치하고 TCP 세그먼트와 UDP 데이터그램을 구분한 구조도.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.blue{fill:#1d4ed8}.violet{fill:#6d28d9}.green{fill:#047857}.amber{fill:#92400e}.card{stroke:#cbd5e1;stroke-width:2}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:52px;font-weight:800}.label,.protocol,.pdu{font-size:42px;font-weight:800}.label{fill:#fff}.protocol{fill:#0f172a}
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text class="ink title" x="55" y="72">TCP/IP 4계층과 PDU</text>

  <g>
    <rect class="card" x="50" y="105" width="1100" height="125" rx="20" fill="#eff6ff"/>
    <rect class="blue" x="70" y="123" width="270" height="89" rx="16"/>
    <text class="label" x="205" y="181" text-anchor="middle">애플리케이션</text>
    <text class="protocol" x="375" y="181">HTTP · SMTP</text>
    <text class="blue pdu" x="965" y="181" text-anchor="middle">메시지</text>
  </g>
  <g>
    <rect class="card" x="50" y="250" width="1100" height="125" rx="20" fill="#f5f3ff"/>
    <rect class="violet" x="70" y="268" width="270" height="89" rx="16"/>
    <text class="label" x="205" y="326" text-anchor="middle">전송</text>
    <text class="protocol" x="375" y="326">TCP · UDP</text>
    <text class="violet pdu" x="870" y="326" text-anchor="middle">TCP 세그먼트 · UDP 데이터그램</text>
  </g>
  <g>
    <rect class="card" x="50" y="395" width="1100" height="125" rx="20" fill="#ecfdf5"/>
    <rect class="green" x="70" y="413" width="270" height="89" rx="16"/>
    <text class="label" x="205" y="471" text-anchor="middle">인터넷</text>
    <text class="protocol" x="375" y="471">IP · ICMP</text>
    <text class="green pdu" x="965" y="471" text-anchor="middle">IP 패킷</text>
  </g>
  <g>
    <rect class="card" x="50" y="540" width="1100" height="125" rx="20" fill="#fff7ed"/>
    <rect class="amber" x="70" y="558" width="270" height="89" rx="16"/>
    <text class="label" x="205" y="616" text-anchor="middle">네트워크 접근</text>
    <text class="protocol" x="375" y="616">Ethernet · Wi-Fi</text>
    <text class="amber pdu" x="965" y="616" text-anchor="middle">프레임</text>
  </g>
</svg>
