<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="tcp-encapsulation-flow-title tcp-encapsulation-flow-desc">
  <title id="tcp-encapsulation-flow-title">TCP 기반 HTTP/1.1 캡슐화와 역캡슐화</title>
  <desc id="tcp-encapsulation-flow-desc">TCP를 사용하는 HTTP/1.1 메시지가 TCP 세그먼트, IP 패킷, 링크 프레임으로 캡슐화되고 수신 측에서 역순으로 처리되는 흐름도.</desc>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.blue{fill:#1d4ed8}.violet{fill:#6d28d9}.green{fill:#047857}.amber{fill:#92400e}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:5}text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:52px;font-weight:800}.heading{font-size:42px;font-weight:800}.step{fill:#fff;font-size:42px;font-weight:800}.network{font-size:42px;font-weight:800}
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text class="ink title" x="55" y="72">TCP 기반 HTTP/1.1 캡슐화</text>

  <rect class="panel" x="45" y="105" width="465" height="570" rx="24"/>
  <text class="ink heading" x="277" y="160" text-anchor="middle">송신: 캡슐화</text>
  <rect class="blue" x="90" y="190" width="375" height="76" rx="16"/>
  <text class="step" x="277" y="241" text-anchor="middle">HTTP/1.1</text>
  <path class="line" d="M277 266v35" marker-end="url(#down)"/>
  <rect class="violet" x="90" y="310" width="375" height="76" rx="16"/>
  <text class="step" x="277" y="361" text-anchor="middle">TCP 세그먼트</text>
  <path class="line" d="M277 386v35" marker-end="url(#down)"/>
  <rect class="green" x="90" y="430" width="375" height="76" rx="16"/>
  <text class="step" x="277" y="481" text-anchor="middle">IP 패킷</text>
  <path class="line" d="M277 506v35" marker-end="url(#down)"/>
  <rect class="amber" x="90" y="550" width="375" height="76" rx="16"/>
  <text class="step" x="277" y="601" text-anchor="middle">링크 프레임</text>

  <path class="line" d="M530 390h140" marker-start="url(#side)" marker-end="url(#side)"/>
  <text class="ink network" x="600" y="365" text-anchor="middle">네트워크</text>

  <rect class="panel" x="690" y="105" width="465" height="570" rx="24"/>
  <text class="ink heading" x="922" y="160" text-anchor="middle">수신: 역캡슐화</text>
  <rect class="amber" x="735" y="190" width="375" height="76" rx="16"/>
  <text class="step" x="922" y="241" text-anchor="middle">링크 프레임</text>
  <path class="line" d="M922 266v35" marker-end="url(#down)"/>
  <rect class="green" x="735" y="310" width="375" height="76" rx="16"/>
  <text class="step" x="922" y="361" text-anchor="middle">IP 패킷</text>
  <path class="line" d="M922 386v35" marker-end="url(#down)"/>
  <rect class="violet" x="735" y="430" width="375" height="76" rx="16"/>
  <text class="step" x="922" y="481" text-anchor="middle">TCP 세그먼트</text>
  <path class="line" d="M922 506v35" marker-end="url(#down)"/>
  <rect class="blue" x="735" y="550" width="375" height="76" rx="16"/>
  <text class="step" x="922" y="601" text-anchor="middle">HTTP/1.1</text>

  <defs>
    <marker id="down" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="side" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
</svg>
