<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="tcp-encapsulation-flow-title tcp-encapsulation-flow-desc">
  <title id="tcp-encapsulation-flow-title">HTTP 요청의 캡슐화와 역캡슐화</title>
  <desc id="tcp-encapsulation-flow-desc">송신 측에서 HTTP 메시지에 TCP, IP, 링크 계층 정보가 누적되고 수신 측에서 반대 순서로 해석되는 흐름도.</desc>
  <style>
    .bg { fill: #f8fafc; } .ink { fill: #0f172a; } .muted { fill: #475569; } .border { stroke: #cbd5e1; } .blue { fill: #2563eb; } .violet { fill: #7c3aed; } .green { fill: #059669; } .amber { fill: #d97706; } .danger { fill: #dc2626; } .line { fill: none; stroke: #334155; stroke-width: 3; } text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; } .heading { font-size: 27px; font-weight: 800; } .step { font-size: 17px; font-weight: 700; } .small { font-size: 15px; }
  </style>
  <rect class="bg" width="1200" height="720" rx="28"/>
  <text class="ink" x="70" y="65" font-size="34" font-weight="800">HTTP 요청이 이동할 때: 캡슐화와 역캡슐화</text>
  <text class="muted" x="70" y="98" font-size="19">각 계층은 자신의 전달 정보만 더하거나 해석한다.</text>
  <rect class="panel" x="60" y="132" width="410" height="514" rx="22"/>
  <text class="ink heading" x="92" y="178">송신 측: 캡슐화</text>
  <text class="muted small" x="92" y="204">위에서 아래로 헤더가 누적된다</text>
  <g transform="translate(92 232)"><rect class="blue" width="344" height="58" rx="10"/><text fill="#fff" class="step" x="172" y="35" text-anchor="middle">HTTP 메시지</text></g>
  <path class="line" d="M264 290v27" marker-end="url(#down)"/>
  <g transform="translate(92 322)"><rect class="violet" width="104" height="58" rx="10"/><rect fill="#ede9fe" x="108" width="236" height="58" rx="10"/><text fill="#fff" class="step" x="52" y="35" text-anchor="middle">TCP</text><text class="ink step" x="226" y="35" text-anchor="middle">HTTP 메시지</text></g>
  <path class="line" d="M264 380v27" marker-end="url(#down)"/>
  <g transform="translate(92 412)"><rect class="green" width="76" height="58" rx="10"/><rect class="violet" x="80" width="88" height="58" rx="10"/><rect fill="#ecfdf5" x="172" width="172" height="58" rx="10"/><text fill="#fff" class="step" x="38" y="35" text-anchor="middle">IP</text><text fill="#fff" class="step" x="124" y="35" text-anchor="middle">TCP</text><text class="ink step" x="258" y="35" text-anchor="middle">HTTP</text></g>
  <path class="line" d="M264 470v27" marker-end="url(#down)"/>
  <g transform="translate(92 502)"><rect class="amber" width="66" height="58" rx="10"/><rect class="green" x="70" width="56" height="58" rx="10"/><rect class="violet" x="130" width="64" height="58" rx="10"/><rect fill="#fff7ed" x="198" width="146" height="58" rx="10"/><text fill="#fff" class="step" x="33" y="35" text-anchor="middle">링크</text><text fill="#fff" class="step" x="98" y="35" text-anchor="middle">IP</text><text fill="#fff" class="step" x="162" y="35" text-anchor="middle">TCP</text><text class="ink step" x="271" y="35" text-anchor="middle">HTTP</text></g>
  <text class="muted small" x="92" y="600">프레임은 현재 로컬 링크를 위한 전달 단위</text>
  <path class="line" d="M498 390h204" marker-start="url(#right)" marker-end="url(#right)"/>
  <text class="danger" x="600" y="365" font-size="20" font-weight="800" text-anchor="middle">네트워크 전달</text>
  <text class="muted small" x="600" y="419" text-anchor="middle">라우터를 지나며 링크 프레임은 새로 만들어질 수 있음</text>
  <rect class="panel" x="730" y="132" width="410" height="514" rx="22"/>
  <text class="ink heading" x="762" y="178">수신 측: 역캡슐화</text>
  <text class="muted small" x="762" y="204">아래에서 위로 헤더를 해석한다</text>
  <g transform="translate(762 232)"><rect class="amber" width="66" height="58" rx="10"/><rect class="green" x="70" width="56" height="58" rx="10"/><rect class="violet" x="130" width="64" height="58" rx="10"/><rect fill="#fff7ed" x="198" width="146" height="58" rx="10"/><text fill="#fff" class="step" x="33" y="35" text-anchor="middle">링크</text><text fill="#fff" class="step" x="98" y="35" text-anchor="middle">IP</text><text fill="#fff" class="step" x="162" y="35" text-anchor="middle">TCP</text><text class="ink step" x="271" y="35" text-anchor="middle">HTTP</text></g>
  <path class="line" d="M934 290v27" marker-end="url(#down)"/>
  <g transform="translate(762 322)"><rect class="green" width="76" height="58" rx="10"/><rect class="violet" x="80" width="88" height="58" rx="10"/><rect fill="#ecfdf5" x="172" width="172" height="58" rx="10"/><text fill="#fff" class="step" x="38" y="35" text-anchor="middle">IP</text><text fill="#fff" class="step" x="124" y="35" text-anchor="middle">TCP</text><text class="ink step" x="258" y="35" text-anchor="middle">HTTP</text></g>
  <path class="line" d="M934 380v27" marker-end="url(#down)"/>
  <g transform="translate(762 412)"><rect class="violet" width="104" height="58" rx="10"/><rect fill="#ede9fe" x="108" width="236" height="58" rx="10"/><text fill="#fff" class="step" x="52" y="35" text-anchor="middle">TCP</text><text class="ink step" x="226" y="35" text-anchor="middle">HTTP 메시지</text></g>
  <path class="line" d="M934 470v27" marker-end="url(#down)"/>
  <g transform="translate(762 502)"><rect class="blue" width="344" height="58" rx="10"/><text fill="#fff" class="step" x="172" y="35" text-anchor="middle">HTTP 메시지</text></g>
  <text class="muted small" x="762" y="600">웹 서버 애플리케이션으로 전달</text>
  <defs><marker id="down" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="right" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
</svg>
