<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 810" role="img" aria-labelledby="napt-return-path-title napt-return-path-desc">
<title id="napt-return-path-title">NAPT: 응답은 어느 호스트로?</title>
<desc id="napt-return-path-desc">두 내부 호스트의 포트 51514를 외부 IP 203.0.113.7의 40001과 40002로 변환하고 응답 목적지 포트에 따라 원래 내부 호스트로 돌려보낸다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:24px;fill:#0f172a} .heading{font-size:28px;font-weight:750}.bold{font-weight:700}.muted{fill:#475569}.blue{fill:#1d4ed8}.red{fill:#b91c1c}.green{fill:#047857}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="480" height="810" rx="16" fill="#f8fafc"/>
<text x="24" y="44" class="heading" text-anchor="start">NAPT: 응답은 어느 호스트로?</text>
<text x="24" y="88" class="blue" text-anchor="start">요청 ↓ 출발지 변환</text>
<text x="24" y="122" class="green" text-anchor="start">응답 ↑ 목적지 역변환</text>
<rect x="24" y="145" width="432" height="96" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="181" class="" text-anchor="start">A: 192.168.1.10:51514</text>
<text x="40" y="215" class="" text-anchor="start">B: 192.168.1.11:51514</text>
<path d="M240 241L240 284" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="24" y="297" width="432" height="222" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="334" class="bold" text-anchor="start">NAPT 장치의 변환 상태</text>
<text x="40" y="377" class="" text-anchor="start">A ↔ 203.0.113.7:40001</text>
<text x="40" y="419" class="" text-anchor="start">B ↔ 203.0.113.7:40002</text>
<text x="40" y="476" class="" text-anchor="start">같은 외부 IP · 서로 다른 포트</text>
<path d="M240 519L240 560" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="24" y="575" width="432" height="62" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="611" class="" text-anchor="start">외부 서버: 198.51.100.20:443</text>
<text x="24" y="688" class="bold" text-anchor="start">응답 목적지 :40001 → A</text>
<text x="24" y="726" class="bold" text-anchor="start">응답 목적지 :40002 → B</text>
<text x="24" y="777" class="" text-anchor="start">TCP 연결·문서 예시용 주소 사용.</text>
</svg>
