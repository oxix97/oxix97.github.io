<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 665" role="img" aria-labelledby="time-wait-ack-loss-title time-wait-ack-loss-desc">
<title id="time-wait-ack-loss-title">마지막 ACK가 사라졌다면</title>
<desc id="time-wait-ack-loss-desc">종료 시작 측은 TIME_WAIT에서 상대의 FIN 재전송에 다시 ACK하고 2MSL을 재시작한다. 상대는 ACK 수신 뒤 CLOSED가 된다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:24px;fill:#0f172a} .heading{font-size:28px;font-weight:750}.bold{font-weight:700}.muted{fill:#475569}.blue{fill:#1d4ed8}.red{fill:#b91c1c}.green{fill:#047857}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="480" height="665" rx="16" fill="#f8fafc"/>
<text x="24" y="44" class="heading" text-anchor="start">마지막 ACK가 사라졌다면</text>
<text x="95" y="96" class="bold" text-anchor="middle">종료 시작 측</text>
<text x="377" y="96" class="bold" text-anchor="middle">상대 측</text>
<path d="M80 120L80 530" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M400 120L400 530" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 6"/>
<text x="240" y="157" class="blue" text-anchor="middle">1. 마지막 ACK</text>
<path d="M90 182L320 182" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M331 173L349 191" fill="none" stroke="#b91c1c" stroke-width="3"/>
<path d="M331 191L349 173" fill="none" stroke="#b91c1c" stroke-width="3"/>
<text x="240" y="223" class="red" text-anchor="middle">X 유실</text>
<rect x="7" y="240" width="146" height="43" rx="12" fill="#f8fafc" stroke="#f8fafc" stroke-width="2"/>
<rect x="325" y="240" width="147" height="43" rx="12" fill="#f8fafc" stroke="#f8fafc" stroke-width="2"/>
<text x="80" y="268" class="blue" text-anchor="middle">TIME_WAIT</text>
<text x="400" y="268" class="middle" text-anchor="middle">LAST_ACK</text>
<text x="240" y="326" class="bold" text-anchor="middle">2. FIN 재전송</text>
<path d="M390 351L90 351" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="240" y="414" class="blue" text-anchor="middle">3. ACK 재전송</text>
<path d="M90 439L390 439" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="336" y="476" width="127" height="43" rx="12" fill="#f8fafc" stroke="#f8fafc" stroke-width="2"/>
<text x="400" y="502" class="green" text-anchor="middle">CLOSED</text>
<rect x="24" y="550" width="432" height="96" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="586" class="" text-anchor="start">종료 시작 측: 2MSL 다시 시작</text>
<text x="40" y="620" class="" text-anchor="start">기다리는 동안 FIN에 응답 가능</text>
</svg>
