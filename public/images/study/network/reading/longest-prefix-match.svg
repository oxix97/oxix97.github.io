<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" role="img" aria-labelledby="longest-prefix-match-title longest-prefix-match-desc">
<title id="longest-prefix-match-title">일치한 후보 중 가장 구체적인 경로</title>
<desc id="longest-prefix-match-desc">목적지 10.20.30.40에 default와 /8과 /24가 모두 일치하고 /24를 선택해 다음 홉 192.0.2.2로 전달한다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:24px;fill:#0f172a} .heading{font-size:28px;font-weight:750}.bold{font-weight:700}.muted{fill:#475569}.blue{fill:#1d4ed8}.red{fill:#b91c1c}.green{fill:#047857}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="480" height="610" rx="16" fill="#f8fafc"/>
<text x="24" y="44" class="heading" text-anchor="start">일치한 후보 중 가장 구체적인 경로</text>
<rect x="24" y="80" width="432" height="62" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="116" class="" text-anchor="start">목적지 IP: 10.20.30.40</text>
<path d="M240 142L240 171" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="185" width="432" height="62" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="221" class="" text-anchor="start">default · /0 → 일치</text>
<rect x="24" y="269" width="432" height="62" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="305" class="" text-anchor="start">10.0.0.0/8 → 일치</text>
<rect x="24" y="353" width="432" height="62" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="389" class="" text-anchor="start">10.20.30.0/24 → 선택</text>
<path d="M240 415L240 446" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="460" width="432" height="62" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="496" class="" text-anchor="start">다음 홉: 192.0.2.2</text>
<text x="24" y="569" class="" text-anchor="start">길이 = 일치한 프리픽스 비트 수</text>
</svg>
