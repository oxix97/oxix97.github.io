<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-labelledby="cascading-failure-title cascading-failure-desc">
<title id="cascading-failure-title">느린 의존성에서 시작되는 연쇄 대기</title>
<desc id="cascading-failure-desc">주문 서비스가 장바구니 응답을 기다리고 장바구니 서비스가 지연된 회원 서비스 응답을 기다려 요청 스레드가 쌓이는 동기 호출 예시다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:20px;fill:#0f172a}.heading{font-size:25px;font-weight:750}.bold{font-weight:700}.muted{fill:#475569}.red{fill:#991b1b}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="13" markerHeight="13" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="480" height="560" rx="16" fill="#f8fafc"/>
<text x="24" y="42" class="heading">동기 호출이 대기를 넓히는 과정</text>
<rect x="24" y="70" width="432" height="82" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="44" y="105" class="bold">주문 서비스 C</text>
<text x="44" y="135" class="muted">장바구니 서비스 B의 응답을 기다림</text>
<path d="M240 152L240 190" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="255" y="178" class="muted">동기 호출</text>
<rect x="24" y="202" width="432" height="82" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="44" y="237" class="bold">장바구니 서비스 B</text>
<text x="44" y="267" class="muted">회원 서비스 A의 응답을 기다림</text>
<path d="M240 284L240 322" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="255" y="310" class="muted">동기 호출</text>
<rect x="24" y="334" width="432" height="82" rx="12" fill="#fff1f2" stroke="#b91c1c" stroke-width="2"/>
<text x="44" y="369" class="bold red">회원 서비스 A</text>
<text x="44" y="399" class="red">응답 지연 · 호출이 timeout까지 대기</text>
<rect x="24" y="440" width="432" height="76" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
<text x="44" y="474" class="bold">A의 지연이 반복되면 B와 C의 대기도 누적</text>
<text x="44" y="502" class="muted">대기 중인 요청이 스레드와 연결을 점유한다</text>
<text x="24" y="544" class="muted">각 서비스의 여유 자원이 줄며 장애 범위가 커질 수 있다.</text>
</svg>
