<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" role="img" aria-labelledby="circuit-breaker-states-title circuit-breaker-states-desc">
<title id="circuit-breaker-states-title">서킷 브레이커의 세 가지 상태 전이</title>
<desc id="circuit-breaker-states-desc">최소 호출 수를 모은 뒤 실패율 또는 느린 호출률이 기준 이상이면 Closed에서 Open으로 바뀐다. Half-Open에서는 대기 후 제한된 시험 호출을 허용하며 실패율과 느린 호출률이 모두 기준 미만이면 Closed, 하나라도 기준 이상이면 Open으로 돌아간다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;fill:#0f172a}.heading{font-size:25px;font-weight:750}.state{font-size:22px;font-weight:750}.small{font-size:15px}.bold{font-weight:700}.muted{fill:#475569}.green{fill:#166534}.red{fill:#991b1b}.blue{fill:#1e40af}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="13" markerHeight="13" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="480" height="520" rx="16" fill="#f8fafc"/>
<text x="24" y="40" class="heading">실패를 감지하고 회복을 확인한다</text>
<rect x="150" y="64" width="180" height="104" rx="14" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
<text x="240" y="98" text-anchor="middle" class="state green">CLOSED</text>
<text x="240" y="128" text-anchor="middle">호출을 허용하고 결과 관찰</text>
<text x="240" y="151" text-anchor="middle" class="muted">기본 상태</text>
<rect x="24" y="278" width="198" height="104" rx="14" fill="#fff1f2" stroke="#b91c1c" stroke-width="2"/>
<text x="123" y="312" text-anchor="middle" class="state red">OPEN</text>
<text x="123" y="342" text-anchor="middle">원격 호출 차단</text>
<text x="123" y="365" text-anchor="middle" class="muted">빠르게 실패 또는 폴백</text>
<rect x="258" y="278" width="198" height="104" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="357" y="312" text-anchor="middle" class="state blue">HALF_OPEN</text>
<text x="357" y="342" text-anchor="middle" class="small">대기 후 제한 시험 호출</text>
<text x="357" y="365" text-anchor="middle" class="muted">복구 여부 확인</text>
<path d="M165 168C210 205 230 236 182 278" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="20" y="211" class="bold">최소 호출 수를 채운 뒤</text>
<text x="20" y="237" class="red">실패·느린 호출 기준 이상</text>
<path d="M222 330L258 330" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M357 278C350 224 324 194 297 168" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="350" y="203" class="green bold">회복 기준 충족</text>
<text x="350" y="228" class="green">→ CLOSED</text>
<path d="M286 382C250 444 200 444 164 382" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="240" y="478" text-anchor="middle" class="red bold">실패율·느린 호출률 기준 이상 → OPEN</text>
<text x="24" y="508" class="muted">실제 임계치와 전환 설정은 라이브러리 구성에 따라 다르다.</text>
</svg>
