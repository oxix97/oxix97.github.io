<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="network-scope-title network-scope-desc">
<title id="network-scope-title">LAN·MAN·WAN의 연결 범위</title>
<desc id="network-scope-desc">사무실 LAN, 도시권의 여러 LAN을 잇는 MAN, 멀리 떨어진 사이트를 잇는 WAN을 예시로 보여 준다. 고정 거리 기준이 아니다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:24px;fill:#0f172a} .heading{font-size:28px;font-weight:750}.bold{font-weight:700}.muted{fill:#475569}.blue{fill:#1d4ed8}.red{fill:#b91c1c}.green{fill:#047857}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="480" height="620" rx="16" fill="#f8fafc"/>
<text x="24" y="44" class="heading" text-anchor="start">LAN·MAN·WAN의 연결 범위</text>
<rect x="24" y="85" width="432" height="96" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="121" class="" text-anchor="start">LAN · 한 사무실</text>
<text x="40" y="155" class="" text-anchor="start">PC ↔ 스위치 ↔ 서버</text>
<path d="M240 181L240 211" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="225" width="432" height="96" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="261" class="" text-anchor="start">MAN · 도시권 연결</text>
<text x="40" y="295" class="" text-anchor="start">사무실 LAN ↔ 지사 LAN</text>
<path d="M240 321L240 351" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="365" width="432" height="96" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="401" class="" text-anchor="start">WAN · 원거리 사이트 연결</text>
<text x="40" y="435" class="" text-anchor="start">도시 A ↔ 도시 B / 다른 리전</text>
<text x="24" y="521" class="bold" text-anchor="start">거리의 고정 경계나 속도 등급이</text>
<text x="24" y="557" class="" text-anchor="start">아닌 연결 범위의 예시다.</text>
<text x="24" y="597" class="" text-anchor="start">실제 경로·운영 주체는 따로 확인.</text>
</svg>
