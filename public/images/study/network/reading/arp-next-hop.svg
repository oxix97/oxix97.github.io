<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 825" role="img" aria-labelledby="arp-next-hop-title arp-next-hop-desc">
<title id="arp-next-hop-title">원격 서버로 가는 첫 프레임</title>
<desc id="arp-next-hop-desc">호스트 A는 로컬 링크의 게이트웨이 192.0.2.1을 ARP로 찾는다. IP 목적지는 198.51.100.20이지만 첫 프레임의 목적지 MAC은 게이트웨이다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:24px;fill:#0f172a} .heading{font-size:28px;font-weight:750}.bold{font-weight:700}.muted{fill:#475569}.blue{fill:#1d4ed8}.red{fill:#b91c1c}.green{fill:#047857}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="480" height="825" rx="16" fill="#f8fafc"/>
<text x="24" y="44" class="heading" text-anchor="start">원격 서버로 가는 첫 프레임</text>
<rect x="16" y="75" width="448" height="442" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="32" y="112" class="blue" text-anchor="start">같은 링크 · ARP 요청 범위</text>
<rect x="24" y="134" width="432" height="62" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="170" class="" text-anchor="start">호스트 A: 192.0.2.10</text>
<text x="240" y="246" class="" text-anchor="middle">ARP: 192.0.2.1은 누구인가?</text>
<path d="M240 261L240 300" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="315" width="432" height="96" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="351" class="" text-anchor="start">게이트웨이: 192.0.2.1</text>
<text x="40" y="385" class="" text-anchor="start">ARP 응답: 게이트웨이 MAC</text>
<text x="32" y="464" class="" text-anchor="start">첫 프레임의 목적지 MAC:</text>
<text x="32" y="498" class="bold" text-anchor="start">게이트웨이의 MAC</text>
<path d="M240 517L240 560" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<text x="24" y="601" class="" text-anchor="start">라우터가 다음 링크의 프레임 생성</text>
<rect x="24" y="628" width="432" height="62" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="664" class="" text-anchor="start">원격 서버: 198.51.100.20</text>
<text x="24" y="741" class="bold" text-anchor="start">IP 목적지 = 원격 서버</text>
<text x="24" y="780" class="" text-anchor="start">NAT·터널은 생략한 예시다.</text>
</svg>
