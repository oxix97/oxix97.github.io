<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-labelledby="circuit-breaker-flow-title circuit-breaker-flow-desc">
<title id="circuit-breaker-flow-title">상품 조회 요청의 서킷 브레이커 흐름</title>
<desc id="circuit-breaker-flow-desc">호출 서비스의 조회가 서킷 브레이커를 지난다. 회로가 닫혀 있거나 시험 호출이 허용된 상태에서는 상품 서비스로 전달되고, 열린 상태에서는 원격 호출을 생략하고 조회 불가 대체 응답을 반환한다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:19px;fill:#0f172a}.heading{font-size:25px;font-weight:750}.bold{font-weight:700}.muted{fill:#475569}.blue{fill:#1e40af}.red{fill:#991b1b}.green{fill:#166534}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="13" markerHeight="13" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="480" height="640" rx="16" fill="#f8fafc"/>
<text x="24" y="42" class="heading">호출을 회로 상태에 따라 분기한다</text>
<rect x="24" y="72" width="432" height="72" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="240" y="103" text-anchor="middle" class="bold">호출 서비스</text>
<text x="240" y="130" text-anchor="middle" class="muted">상품 조회 find(id)</text>
<path d="M240 144L240 184" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="196" width="432" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="240" y="229" text-anchor="middle" class="bold blue">Circuit Breaker</text>
<text x="240" y="257" text-anchor="middle" class="muted">호출 결과를 기록하고 상태에 따라 허용</text>
<path d="M185 272L126 316" fill="none" stroke="#166534" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M295 272L354 316" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="326" width="204" height="132" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
<text x="126" y="355" text-anchor="middle" class="bold green">CLOSED · HALF_OPEN</text>
<text x="126" y="386" text-anchor="middle" class="bold">상품 서비스 호출</text>
<text x="126" y="417" text-anchor="middle">GET /catalogs/{id}</text>
<text x="126" y="444" text-anchor="middle" class="muted">응답 결과 기록</text>
<rect x="252" y="326" width="204" height="132" rx="12" fill="#fff1f2" stroke="#b91c1c" stroke-width="2"/>
<text x="354" y="355" text-anchor="middle" class="bold red">OPEN</text>
<text x="354" y="386" text-anchor="middle" class="bold red">원격 호출 생략</text>
<text x="354" y="417" text-anchor="middle">CallNotPermitted</text>
<text x="354" y="444" text-anchor="middle" class="muted">폴백 실행</text>
<path d="M354 458L354 492" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="252" y="504" width="204" height="66" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="354" y="544" text-anchor="middle" class="bold">조회 불가 응답 반환</text>
<text x="24" y="610" class="muted">폴백은 읽기 화면의 안전한 대체 응답에만 사용한다.</text>
</svg>
