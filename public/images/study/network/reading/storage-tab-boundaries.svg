<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-labelledby="storage-tab-boundaries-title storage-tab-boundaries-desc">
<title id="storage-tab-boundaries-title">같은 오리진의 두 탭</title>
<desc id="storage-tab-boundaries-desc">독립적으로 연 같은 오리진의 두 탭은 localStorage를 공유하지만 sessionStorage는 각각 갖는다. 새 창 생성 시 초기 복사 예외는 본문에서 설명한다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:24px;fill:#0f172a} .heading{font-size:28px;font-weight:750}.bold{font-weight:700}.muted{fill:#475569}.blue{fill:#1d4ed8}.red{fill:#b91c1c}.green{fill:#047857}</style>
