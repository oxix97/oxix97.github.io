<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 750" role="img" aria-labelledby="api-response-timing-title api-response-timing-desc">
<title id="api-response-timing-title">API 응답 시간의 구간</title>
<desc id="api-response-timing-desc">연결 설정, 요청 시작부터 첫 바이트까지의 TTFB, 나머지 본문 수신을 순서대로 표시한다. RTT를 별도 구간으로 더하지 않는다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:24px;fill:#0f172a} .heading{font-size:28px;font-weight:750}.bold{font-weight:700}.muted{fill:#475569}.blue{fill:#1d4ed8}.red{fill:#b91c1c}.green{fill:#047857}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="480" height="750" rx="16" fill="#f8fafc"/>
<text x="24" y="44" class="heading" text-anchor="start">API 응답 시간의 구간</text>
<text x="24" y="87" class="muted" text-anchor="start">아래로 갈수록 시간이 흐른다</text>
<rect x="24" y="112" width="432" height="96" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="148" class="" text-anchor="start">1. 연결 설정</text>
<text x="40" y="182" class="" text-anchor="start">새 TCP·TLS 연결일 때 필요</text>
<path d="M240 208L240 238" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="250" width="432" height="262" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="286" class="bold" text-anchor="start">2. TTFB</text>
<text x="40" y="332" class="" text-anchor="start">요청 전송 시작 → 서버 도착</text>
<text x="40" y="400" class="" text-anchor="start">서버·DB·외부 의존성 처리</text>
<text x="40" y="468" class="" text-anchor="start">첫 응답 바이트 → 클라이언트</text>
<path d="M240 342L240 369" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M240 410L240 437" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M240 512L240 542" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="554" width="432" height="62" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="590" class="" text-anchor="start">3. 남은 응답 본문 수신</text>
<text x="24" y="662" class="bold" text-anchor="start">RTT는 별도로 측정한 왕복 지연.</text>
<text x="24" y="702" class="" text-anchor="start">위 구간에 한 번 더 더하지 않는다.</text>
</svg>
