<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="ipv6-zero-compression-title ipv6-zero-compression-desc">
<title id="ipv6-zero-compression-title">IPv6: 여덟 그룹을 짧게 쓰기</title>
<desc id="ipv6-zero-compression-desc">2001:0db8:0000:0000:0000:0000:0000:0001의 그룹별 앞 0을 생략하고 3번부터 7번의 연속 0 그룹을 이중 콜론으로 압축한다.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:24px;fill:#0f172a} .heading{font-size:28px;font-weight:750}.bold{font-weight:700}.muted{fill:#475569}.blue{fill:#1d4ed8}.red{fill:#b91c1c}.green{fill:#047857}</style>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="14" markerHeight="14" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="480" height="760" rx="16" fill="#f8fafc"/>
<text x="24" y="44" class="heading" text-anchor="start">IPv6: 여덟 그룹을 짧게 쓰기</text>
<text x="24" y="88" class="bold" text-anchor="start">1. 각 그룹의 앞쪽 0 생략</text>
<rect x="24" y="118" width="432" height="44" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="148" class="" text-anchor="start">1번    2001   →   2001</text>
<rect x="24" y="167" width="432" height="44" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="197" class="" text-anchor="start">2번    0db8   →   db8</text>
<rect x="24" y="216" width="432" height="44" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="246" class="" text-anchor="start">3번    0000   →   0</text>
<rect x="24" y="265" width="432" height="44" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="295" class="" text-anchor="start">4번    0000   →   0</text>
<rect x="24" y="314" width="432" height="44" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="344" class="" text-anchor="start">5번    0000   →   0</text>
<rect x="24" y="363" width="432" height="44" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="393" class="" text-anchor="start">6번    0000   →   0</text>
<rect x="24" y="412" width="432" height="44" rx="12" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="442" class="" text-anchor="start">7번    0000   →   0</text>
<rect x="24" y="461" width="432" height="44" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="491" class="" text-anchor="start">8번    0001   →   1</text>
<text x="24" y="554" class="bold" text-anchor="start">2. 3~7번의 연속 0 그룹 → ::</text>
<path d="M240 575L240 607" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="620" width="432" height="62" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="656" class="" text-anchor="start">2001:db8::1</text>
<text x="24" y="727" class="" text-anchor="start">::는 한 주소에서 한 번만 사용.</text>
</svg>
